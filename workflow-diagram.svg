<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Promptfoo review classifier evaluation workflow</title>
<desc>Test data and prompt feed into promptfoo eval, which runs three provider models, grades each with an LLM judge across four assertions, and outputs results.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Row 1: Inputs -->
<g>
<rect x="70" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="200" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">review_test_data.json</text>
<text x="200" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">15 hand-labeled test cases</text>
</g>
<g>
<rect x="350" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="480" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">review_classifier.md</text>
<text x="480" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">prompt sent to each model</text>
</g>

<path d="M200 96 L200 126 L340 126 L340 156" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480 96 L480 126 L340 126 L340 156" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Row 2: promptfoo eval -->
<g>
<rect x="210" y="156" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">promptfoo eval</text>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">runs 15 cases x 3 providers</text>
</g>

<path d="M340 212 L340 242 L140 242 L140 272" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 212 L340 272" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 212 L340 242 L540 242 L540 272" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Row 3: Providers -->
<g>
<rect x="50" y="272" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Gemini</text>
<text x="140" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">3.5 Flash-Lite</text>
</g>
<g>
<rect x="250" y="272" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Claude</text>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Haiku 4.5</text>
</g>
<g>
<rect x="450" y="272" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">OpenAI</text>
<text x="540" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">GPT-4.1 mini</text>
</g>

<path d="M140 328 L140 358 L340 358 L340 388" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 328 L340 388" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M540 328 L540 358 L340 358 L340 388" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Row 4: Assertions -->
<g>
<rect x="190" y="388" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="406" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">4 assertions</text>
<text x="340" y="424" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">graded by Gemini (fixed judge)</text>
</g>

<path d="M340 444 L340 504" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Row 5: Results -->
<g>
<rect x="200" y="504" width="280" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="522" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">results</text>
<text x="340" y="540" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#27500A">results.html + terminal table</text>
</g>
</svg>
